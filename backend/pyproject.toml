[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-dashboard"
version = "0.1.0"
description = "Self-hosted personal planning dashboard API"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "icalendar>=6.1,<7",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "recurring-ical-events>=3.8,<4",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
